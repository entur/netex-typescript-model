name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      netex-version: ${{ steps.netex.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: html-ts-gen/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('json-schema/pom.xml') }}
          restore-keys: maven-

      - run: npm ci
        working-directory: html-ts-gen

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract NeTEx version from config
        id: netex
        run: |
          NV=$(grep '"version"' assembly-config.json | head -1 | sed 's/.*: *"\([^"]*\)".*/\1/')
          echo "value=$NV" >> "$GITHUB_OUTPUT"

      - name: Build full assembly + generator tarball
        run: make all tarball-generator ASSEMBLY=network+timetable+fares+new-modes VERSION=${{ steps.version.outputs.value }}

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          NV=${{ steps.netex.outputs.value }}
          TAG=$GITHUB_REF_NAME
          # JSON Schema (raw .json, versioned + versionless alias)
          cp generated-src/fares+network+new-modes+timetable/fares+network+new-modes+timetable.schema.json \
             release-assets/netex-jsonschema-full-${NV}-${TAG}.json
          cp generated-src/fares+network+new-modes+timetable/fares+network+new-modes+timetable.schema.json \
             release-assets/netex-jsonschema-full-${NV}.json
          # Generator npm tarball (versioned + versionless alias)
          cp generated-src/netex-ts-gen-${TAG}.tgz release-assets/netex-ts-gen-${TAG}.tgz
          cp generated-src/netex-ts-gen-${TAG}.tgz release-assets/netex-ts-gen.tgz
          ls -la release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: assembly-full
          path: generated-src/fares+network+new-modes+timetable/
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: xsd
          path: xsd/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: html-ts-gen/package-lock.json

      - run: sudo apt-get install -y libxml2-utils

      - run: npm ci
        working-directory: html-ts-gen

      - uses: actions/download-artifact@v4
        with:
          name: assembly-full
          path: generated-src/fares+network+new-modes+timetable/

      - uses: actions/download-artifact@v4
        with:
          name: xsd
          path: xsd/

      - name: Run tests
        working-directory: html-ts-gen
        run: npx vitest run

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/

      - name: Smoke test — install generator + use --schema with raw .json
        run: |
          NV=${{ needs.build.outputs.netex-version }}
          mkdir smoke && cd smoke
          npm init -y
          npm install ../release-assets/netex-ts-gen.tgz
          mkdir gen
          npx netex-ts-gen \
            --schema ../release-assets/netex-jsonschema-full-${NV}.json \
            --dest-dir ./gen --overwrite \
            VehicleType Vehicle DeckPlan
          ls gen/
          test -f gen/Vehicle.ts
          test -f gen/Vehicle-mapping.ts
          test -f gen/VehicleType.ts
          test -f gen/VehicleType-mapping.ts
          test -f gen/DeckPlan.ts
          test -f gen/DeckPlan-mapping.ts

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" --notes "$NOTES" release-assets/*
